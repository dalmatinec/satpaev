# Сайт без nginx на сервере: Caddy с автоматическим SSL.
# Сеть хоста нужна, чтобы Caddy видел API бота на 127.0.0.1:8090.
name: satpaev-site

services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-:80}
      API_UPSTREAM: ${API_UPSTREAM:-http://127.0.0.1:8090}
      SITE_HOST: ${SITE_ADDRESS:-}
    volumes:
      - ./www:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy_data:
  caddy_config:
